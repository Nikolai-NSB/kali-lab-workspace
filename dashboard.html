<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow & Prospecting Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">Workflow Automation & Prospecting</h1>
                <p class="text-slate-400 text-sm">Client template generator and CASL-compliant outreach manager.</p>
            </div>
            <span class="text-xs bg-emerald-950 text-emerald-300 px-3 py-1 rounded-full border border-emerald-800">Local Sandbox Active</span>
        </header>

        <!-- Main Card -->
        <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700 space-y-6">
            <h2 class="text-lg font-semibold text-slate-200">Quick Generator</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Client / Business Name</label>
                    <input type="text" id="clientName" placeholder="e.g. Acme Corp" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Report / Outreach Type</label>
                    <select id="reportType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="seo">Weekly SEO & Traffic Brief</option>
                        <option value="project">Project Status & Milestones</option>
                        <option value="outreach">CASL-Compliant B2B Pitch</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Key Notes or Metrics</label>
                <textarea id="notes" rows="3" placeholder="Enter key metrics, traffic numbers, or specific observations..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
            </div>
            <button onclick="generateContent()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg transition-all shadow-md">Generate Deliverable</button>
        </div>

        <!-- Output Section -->
        <div class="mt-6 bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-semibold uppercase text-slate-400">Generated Output Preview</h3>
                <button onclick="copyOutput()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-200">Copy to Clipboard</button>
            </div>
            <pre id="outputBox" class="bg-slate-950 p-4 rounded-lg text-emerald-300 text-sm overflow-x-auto whitespace-pre-wrap border border-slate-800">Your generated brief or email draft will appear here...</pre>
        </div>
    </div>

    <script>
        function generateContent() {
            const name = document.getElementById('clientName').value || '[Client Name]';
            const type = document.getElementById('reportType').value;
            const notes = document.getElementById('notes').value || 'Standard metrics tracking applied.';
            let output = '';

            if (type === 'seo') {
                output = `# Weekly Performance Brief: ${name}\n**Week Ending:** October 2026\n\n## 1. Executive Summary\n* **Status:** Active & Optimized\n* **Notes:** ${notes}\n\n## 2. Traffic & Acquisition\n* Organic search momentum holding strong.\n* Regular technical audits clear.\n\n## 3. Recommended Actions\n1. Publish targeted content updates.\n2. Review top keyword rankings.`;
            } else if (type === 'project') {
                output = `# Project Status Report: ${name}\n**Milestone Target:** Q4 2026\n\n## 1. Milestone Health\n* **Status:** On Schedule\n* **Notes:** ${notes}\n\n## 2. Deliverables Update\n* Core tasks advancing as projected.\n* Zero blocking issues detected.`;
            } else {
                output = `Subject: Quick question regarding ${name}'s organic search footprint\n\nHi Team,\n\nI was reviewing local service sites in Edmonton and came across ${name}. ${notes}\n\nI run a local reporting service here in Edmonton that automates weekly traffic and SEO performance briefs.\n\nLet me know if you'd like a complimentary sample report!\n\nBest,\nNick`;
            }

            document.getElementById('outputBox').textContent = output;
        }

        function copyOutput() {
            const text = document.getElementById('outputBox').textContent;
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }
    </script>
</body>
</html>
