<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow & Prospecting CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-emerald-400">Freelance Workflow & CRM</h1>
                <p class="text-slate-400 text-xs md:text-sm">Reports, CASL Outreach, and Prospect Tracking.</p>
            </div>
            <span class="text-xs bg-emerald-950 text-emerald-300 px-3 py-1 rounded-full border border-emerald-800">Mobile Ready</span>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex space-x-2 border-b border-slate-800 pb-2">
            <button onclick="switchTab('generator')" id="tab-generator" class="px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-slate-950 transition-all">Generator & Outreach</button>
            <button onclick="switchTab('tracker')" id="tab-tracker" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all">Prospect CRM (<span id="prospectCount">0</span>)</button>
        </div>

        <!-- TAB 1: GENERATOR -->
        <div id="section-generator" class="space-y-6">
            <div class="bg-slate-800 rounded-xl p-5 shadow-xl border border-slate-700 space-y-4">
                <h2 class="text-md font-semibold text-slate-200">Deliverable & Outreach Creator</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Client / Target Business Name</label>
                        <input type="text" id="clientName" placeholder="e.g. Acme Corp" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Category / Template</label>
                        <select id="reportType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="seo">Weekly SEO & Traffic Brief</option>
                            <option value="project">Project Status & Milestones</option>
                            <option value="invoice">Professional Service Invoice</option>
                            <option value="audit">Technical Site Audit Summary</option>
                            <option value="outreach">CASL-Compliant B2B Pitch</option>
                            <option value="followup">B2B Follow-up Sequence</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Key Notes, Metrics or Target Email</label>
                    <textarea id="notes" rows="3" placeholder="Enter metrics, project scope, or client contact email for direct outreach..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <div class="flex flex-col md:flex-row gap-3">
                    <button onclick="generateContent()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg transition-all shadow-md">Generate Deliverable</button>
                    <button onclick="saveToCRM()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold px-4 py-2.5 rounded-lg transition-all">Save to Prospect CRM</button>
                </div>
            </div>

            <!-- Output Section -->
            <div class="bg-slate-800 rounded-xl p-5 shadow-xl border border-slate-700">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-semibold uppercase text-slate-400">Generated Output Preview</h3>
                    <div class="space-x-2">
                        <button onclick="sendEmailDirect()" id="emailBtn" class="hidden text-xs bg-emerald-700 hover:bg-emerald-600 px-3 py-1 rounded text-white font-semibold">Send via Email App</button>
                        <button onclick="copyOutput()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-200">Copy Text</button>
                    </div>
                </div>
                <pre id="outputBox" class="bg-slate-950 p-4 rounded-lg text-emerald-300 text-xs md:text-sm overflow-x-auto whitespace-pre-wrap border border-slate-800">Select options above and click Generate Deliverable...</pre>
            </div>
        </div>

        <!-- TAB 2: PROSPECT TRACKER CRM -->
        <div id="section-tracker" class="hidden space-y-6">
            <div class="bg-slate-800 rounded-xl p-5 shadow-xl border border-slate-700 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-md font-semibold text-slate-200">Active Prospect Pipeline</h2>
                    <button onclick="clearCRM()" class="text-xs bg-red-950 text-red-300 border border-red-800 px-3 py-1 rounded hover:bg-red-900">Clear All</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">Business</th>
                                <th class="p-3">Type</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="crmTableBody" class="divide-y divide-slate-700">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let prospects = JSON.parse(localStorage.getItem('freelance_prospects')) || [];

        function switchTab(tab) {
            if (tab === 'generator') {
                document.getElementById('section-generator').classList.remove('hidden');
                document.getElementById('section-tracker').classList.add('hidden');
                document.getElementById('tab-generator').className = "px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-slate-950 transition-all";
                document.getElementById('tab-tracker').className = "px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all";
            } else {
                document.getElementById('section-generator').classList.add('hidden');
                document.getElementById('section-tracker').classList.remove('hidden');
                document.getElementById('tab-tracker').className = "px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-slate-950 transition-all";
                document.getElementById('tab-generator').className = "px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all";
                renderCRM();
            }
        }

        function generateContent() {
            const name = document.getElementById('clientName').value || '[Client Name]';
            const type = document.getElementById('reportType').value;
            const notes = document.getElementById('notes').value || 'Standard delivery specifications applied.';
            let output = '';

            document.getElementById('emailBtn').classList.add('hidden');

            if (type === 'seo') {
                output = `# Weekly Performance Brief: ${name}\n**Week Ending:** October 2026\n\n## 1. Executive Summary\n* **Status:** Active & Optimized\n* **Notes:** ${notes}\n\n## 2. Traffic & Acquisition\n* Organic search momentum holding strong.\n* Regular technical audits clear.\n\n## 3. Recommended Actions\n1. Publish targeted content updates.\n2. Review top keyword rankings.`;
            } else if (type === 'project') {
                output = `# Project Status Report: ${name}\n**Milestone Target:** Q4 2026\n\n## 1. Milestone Health\n* **Status:** On Schedule\n* **Notes:** ${notes}\n\n## 2. Deliverables Update\n* Core tasks advancing as projected.\n* Zero blocking issues detected.`;
            } else if (type === 'invoice') {
                output = `# Service Invoice: ${name}\n**Date:** October 24, 2026\n\n## Line Items\n* Automated Workflow Setup & Reporting Brief: $350.00\n* Local SEO Optimization & Prospecting Pipeline: $250.00\n\n**Total Due:** $600.00 CAD\n**Payment Terms:** Net 30`;
            } else if (type === 'audit') {
                output = `# Technical Audit Summary: ${name}\n\n## Overview\n* **Performance Score:** 94/100\n* **Mobile Responsiveness:** Verified\n* **Notes:** ${notes}\n\n## Recommendations\n* Optimize image asset compression.\n* Implement schema markup for local service visibility.`;
            } else if (type === 'outreach') {
                output = `Subject: Quick question regarding ${name}'s organic search footprint\n\nHi Team,\n\nI was reviewing local service sites in Edmonton and came across ${name}. ${notes}\n\nI run a local reporting service here in Edmonton that automates weekly traffic and SEO performance briefs for businesses like yours.\n\nI put together a quick, un-billed sample summary of what a weekly tracking report looks like for a site in your niche. If you'd like me to shoot it over, let me know!\n\nBest regards,\nNick`;
                document.getElementById('emailBtn').classList.remove('hidden');
            } else if (type === 'followup') {
                output = `Subject: Following up: ${name}'s sample performance brief\n\nHi Team,\n\nJust bubbling this to the top of your inbox. I recently pulled together a sample SEO & traffic visibility breakdown tailored for ${name}.\n\nNo pressure at all, but let me know if you'd like me to forward over the PDF/summary for your review.\n\nBest regards,\nNick`;
                document.getElementById('emailBtn').classList.remove('hidden');
            }

            document.getElementById('outputBox').textContent = output;
        }

        function sendEmailDirect() {
            const name = document.getElementById('clientName').value || 'contact@business.com';
            const text = document.getElementById('outputBox').textContent;
            const lines = text.split('\n');
            const subject = lines[0].replace('Subject: ', '');
            const body = lines.slice(2).join('\n');
            window.location.href = `mailto:${name}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        function copyOutput() {
            const text = document.getElementById('outputBox').textContent;
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }

        function saveToCRM() {
            const name = document.getElementById('clientName').value;
            const type = document.getElementById('reportType').value;
            if (!name) {
                alert('Please enter a Client / Business Name first.');
                return;
            }
            prospects.push({ id: Date.now(), name, type, status: 'Contacted' });
            localStorage.setItem('freelance_prospects', JSON.stringify(prospects));
            updateCount();
            alert('Added to Prospect CRM!');
        }

        function updateCount() {
            document.getElementById('prospectCount').textContent = prospects.length;
        }

        function renderCRM() {
            const tbody = document.getElementById('crmTableBody');
            tbody.innerHTML = '';
            if (prospects.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">No prospects saved yet.</td></tr>`;
                return;
            }
            prospects.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-700">
                        <td class="p-3 font-medium text-slate-200">${p.name}</td>
                        <td class="p-3 text-slate-400 uppercase text-xs">${p.type}</td>
                        <td class="p-3">
                            <select onchange="updateStatus(${index}, this.value)" class="bg-slate-900 border border-slate-700 rounded p-1 text-xs text-emerald-400">
                                <option ${p.status==='Pending'?'selected':''}>Pending</option>
                                <option ${p.status==='Contacted'?'selected':''}>Contacted</option>
                                <option ${p.status==='Responded'?'selected':''}>Responded</option>
                                <option ${p.status==='Converted'?'selected':''}>Converted</option>
                            </select>
                        </td>
                        <td class="p-3">
                            <button onclick="removeProspect(${index})" class="text-xs text-red-400 hover:text-red-300">Delete</button>
                        </td>
                    </tr>`;
            });
        }

        function updateStatus(index, status) {
            prospects[index].status = status;
            localStorage.setItem('freelance_prospects', JSON.stringify(prospects));
        }

        function removeProspect(index) {
            prospects.splice(index, 1);
            localStorage.setItem('freelance_prospects', JSON.stringify(prospects));
            renderCRM();
            updateCount();
        }

        function clearCRM() {
            if (confirm('Clear all saved prospects?')) {
                prospects = [];
                localStorage.removeItem('freelance_prospects');
                renderCRM();
                updateCount();
            }
        }

        updateCount();
    </script>
</body>
</html>
